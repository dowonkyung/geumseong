name: Install website banner manager
on:
  push:
    paths: ['.github/workflows/install-banner-manager.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check home-banners.js
      - run: node scripts/install-banner-manager.cjs
      - run: node scripts/sync-navigation.cjs
      - name: Save integrated banner manager
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Integrate administrator-managed home banners"
          git push
