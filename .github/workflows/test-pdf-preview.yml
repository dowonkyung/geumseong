name: Validate mobile PDF compatibility
on:
  push:
    paths: ['pdf-preview.mjs', 'pdf-text.mjs', 'news-preview.js', 'scripts/test-pdf-text.mjs', '.github/workflows/test-pdf-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  streams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check pdf-preview.mjs
      - run: node --check news-preview.js
      - run: node scripts/test-pdf-text.mjs
