name: Configure shared membership
on:
  push:
    paths: ['.github/workflows/shared-membership.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/configure-shared-membership.cjs
      - run: node scripts/sync-navigation.cjs
      - name: Save isolated site configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Share member accounts and isolate Geumseong website content"
          git push
