name: Refresh post share previews
on:
  push:
    branches: [main]
    paths-ignore: ['share/**', 'post-routes.json', 'news/**', 'notice/**', 'bid/**', 'legislation/**', 'general/**', 'gazette/**', 'press/**', 'briefing/**', 'facts/**', 'activity/**', 'media/**', 'photo/**', 'video/**', 'free/**', 'praise/**', 'civil-board/**']
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: share-previews
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check post-routes.js
          node --check community.js
          node --check board.js
          node --check photo-board.js
          node --check video-gallery.js
          node scripts/sync-navigation.cjs
          node scripts/refresh-share-pages.cjs
      - name: Publish post addresses and previews
        run: |
          git add -- '*.html' share post-routes.json news notice bid legislation general gazette press briefing facts activity media photo video free praise civil-board
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh permanent post addresses and article previews"
          git pull --rebase origin main
          git push
