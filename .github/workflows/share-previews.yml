name: Refresh post share previews
on:
  push:
    branches: [main]
    paths-ignore: ['share/**', 'civil-board/**']
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: share-previews
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh-share-pages.cjs
      - name: Publish updated previews and civil post addresses
        run: |
          git add share civil-board
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public previews and permanent civil post addresses"
          git pull --rebase origin main
          git push
