name: Synchronize Geumseong address and office gallery
on:
  push:
    paths: ['.github/workflows/update-office-gallery.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/update-office-gallery.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Synchronize province address and office gallery asset versions"
          git push
