name: Rename Geumseong governor files
on:
  push:
    paths:
      - '.github/workflows/rename-governor.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/rename-governor.cjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Rename governor pages and assets; apply supplied governor images"
          git push
